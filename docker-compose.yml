services:
  db:
    image: postgres:15
    container_name: aria-db
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rootpassword}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_DB: ${POSTGRES_DB:-ariadb}
    ports:
      - "5432:5432"
    networks:
      - aria-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.0-alpine
    container_name: aria-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - aria-network

  flask-app:
    build:
      context: ./aria-app
      dockerfile: Dockerfile
    container_name: aria-flask-app
    restart: always
    environment:
      - DATABASE_URL=postgresql://root:${POSTGRES_PASSWORD:-rootpassword}@db:5432/ariadb
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    ports:
      - "5000:5000"
    command: ["sh", "-c", "python main.py"]
    networks:
      - aria-network
    volumes:
      - ./aria-app/website/static:/app/website/static
      - ./aria-app/website/templates:/app/website/templates
      - ./aria-app/website/routes:/app/website/routes

  pi-simulator:
    build:
      context: ./aria-app/client
      dockerfile: Dockerfile.simulator
    container_name: aria-pi-simulator
    restart: always
    env_file: .env
    environment:
      - ARIA_API_URL=http://flask-app:5000/api
    depends_on:
      - flask-app
      - redis
    networks:
      - aria-network
    volumes:
      - ./pi-simulator/test_images:/app/test_images
      - ./aria-app/website/static/uploads:/app/model_data

networks:
  aria-network:
    driver: bridge

volumes:
  postgres_data:
