{% extends "auth_base.aria.html" %}
{% block title %}Login - ARIA{% endblock %}

{% block auth_content %}
<div class="w-full">
  <div class="mb-6 text-center sm:text-left">
    <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Welcome Back</h2>
    <p class="text-sm text-slate-500 mt-1">Enter your credentials to access your ARIA dashboard.</p>
  </div>

  <form method="POST" hx-boost="true" class="space-y-5" x-data="{ showPassword: false }">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
    
    <div>
      <label for="userID" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
        User ID / Matric Number
      </label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
          <i class="fa fa-id-card-o text-sm"></i>
        </div>
        <input type="text"
               id="userID"
               name="userID"
               placeholder="e.g. BI21110001 or STAFF100"
               required
               autofocus
               class="block w-full pl-10 pr-3.5 py-2.5 text-sm text-slate-900 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-600 focus:border-blue-600 transition-colors">
      </div>
    </div>

    <div>
      <div class="flex items-center justify-between mb-1.5">
        <label for="userPassword" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">
          Password
        </label>
      </div>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
          <i class="fa fa-lock text-sm"></i>
        </div>
        <input :type="showPassword ? 'text' : 'password'"
               id="userPassword"
               name="userPassword"
               placeholder="••••••••"
               required
               class="block w-full pl-10 pr-10 py-2.5 text-sm text-slate-900 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-600 focus:border-blue-600 transition-colors">
        <button type="button"
                @click="showPassword = !showPassword"
                class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none"
                aria-label="Toggle password visibility">
          <i class="fa" :class="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
        </button>
      </div>
    </div>

    <div class="flex items-center justify-between text-sm">
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="checkbox" id="rememberMe" class="w-4 h-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500">
        <span class="text-xs text-slate-600">Remember me</span>
      </label>
      <a href="#" class="text-xs font-semibold text-blue-700 hover:text-blue-900 transition-colors">Forgot password?</a>
    </div>

    <button type="submit"
            class="w-full inline-flex items-center justify-center gap-2 py-3 px-4 text-sm font-semibold text-white bg-blue-700 hover:bg-blue-800 focus:outline-none focus:ring-4 focus:ring-blue-200 rounded-xl shadow-sm transition-all hover:shadow">
      <span>Sign In</span>
      <i class="fa fa-arrow-right text-xs"></i>
    </button>
  </form>

  <div class="mt-8 pt-6 border-t border-slate-100 text-center">
    <p class="text-xs text-slate-500 mb-3">Don't have an account yet?</p>
    <a href="/RegisterSelect"
       class="inline-flex items-center justify-center px-4 py-2 text-xs font-semibold text-blue-700 bg-blue-50 hover:bg-blue-100 rounded-full transition-colors">
      Create an Account
    </a>
  </div>
</div>
{% endblock %}
