{% extends "auth_aria_base.html" %}
{% block title %}Login - ARIA{% endblock %}

{% block auth_content %}
<div class="auth-card">
    <div class="mb-4">
        <h2 class="fw-bold text-dark">Welcome Back</h2>
        <p class="text-muted">Enter your credentials to access your dashboard.</p>
    </div>

    <form method="POST" hx-boost="true" hx-indicator="#login-spinner">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="userID" name="userID" placeholder="ID Number" required autofocus>
            <label for="userID">User ID / Matric Number</label>
        </div>

        <div class="form-floating mb-3 position-relative">
            <input type="password" class="form-control" id="userPassword" name="userPassword" placeholder="Password" required>
            <label for="userPassword">Password</label>
            <span class="password-toggle" data-target="#userPassword">
                <i class="fa fa-eye"></i>
            </span>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                <label class="form-check-label small text-muted" for="rememberMe">
                    Remember me
                </label>
            </div>
            <a href="#" class="small text-primary text-decoration-none fw-bold">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 py-3 rounded-pill fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">
            <span>Sign In</span>
            <div id="login-spinner" class="htmx-indicator spinner-border spinner-border-sm" role="status"></div>
        </button>
    </form>

    <div class="text-center mt-5">
        <p class="text-muted small">Don't have an account yet?</p>
        <a href="/RegisterSelect" class="btn btn-outline-primary px-4 rounded-pill fw-bold">Create an Account</a>
    </div>
</div>
{% endblock %}
