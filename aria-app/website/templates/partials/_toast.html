<div class="aria-toast-item toast show" role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="true">
  <div class="toast-header">
    <strong class="me-auto text-{{ type or 'info' }}">
      {% if type == 'success' %}<i class="fa fa-check-circle"></i> Success
      {% elif type == 'error' %}<i class="fa fa-exclamation-circle"></i> Error
      {% elif type == 'warning' %}<i class="fa fa-warning"></i> Warning
      {% else %}<i class="fa fa-info-circle"></i> Information
      {% endif %}
    </strong>
    <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
  </div>
  <div class="toast-body">
    {{ message }}
  </div>
</div>
