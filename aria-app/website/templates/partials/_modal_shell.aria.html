<!-- Reusable Alpine Modal Shell -->
<div x-data="{ open: false, modalId: '{{ modal_id }}' }"
     @open-modal.window="if ($event.detail.id === modalId) open = true"
     @close-modal.window="if ($event.detail.id === modalId) open = false"
     @keydown.escape.window="open = false"
     x-show="open"
     class="fixed inset-0 z-50 overflow-y-auto"
     style="display: none;"
     role="dialog"
     aria-modal="true"
     aria-labelledby="{{ modal_id }}-title">

  <!-- Backdrop -->
  <div x-show="open"
       x-transition:enter="ease-out duration-200"
       x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100"
       x-transition:leave="ease-in duration-150"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       @click="open = false"
       class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs transition-opacity"></div>

  <!-- Modal Container -->
  <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
    <div x-show="open"
         x-transition:enter="ease-out duration-200"
         x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
         x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
         x-transition:leave="ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
         x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
         @click.outside="open = false"
         class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all sm:my-8 sm:w-full {{ max_width|default('sm:max-w-lg') }} border border-slate-100">

      <!-- Header -->
      <div class="flex items-center justify-between border-b border-slate-100 px-6 py-4">
        <h3 id="{{ modal_id }}-title" class="text-lg font-bold text-slate-900">{{ modal_title }}</h3>
        <button @click="open = false" type="button" class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition" aria-label="Close">
          <i class="fa fa-times text-base"></i>
        </button>
      </div>

      <!-- Content -->
      <div class="px-6 py-5">
        {{ caller() if caller is defined else modal_body|default('')|safe }}
      </div>
    </div>
  </div>
</div>
