<div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
  <!-- Total Registered Users -->
  <div class="aria-card p-5 hover:border-slate-300 transition group">
    <div class="flex items-center gap-3 mb-2">
      <div class="w-9 h-9 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-sm font-semibold group-hover:scale-105 transition">
        <i class="fa fa-users"></i>
      </div>
      <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Registered Users</span>
    </div>
    <div class="text-2xl font-extrabold text-slate-900 tracking-tight">
      {{ student|length + staff|length }}
    </div>
  </div>

  <!-- Rooms Occupied -->
  <div class="aria-card p-5 hover:border-slate-300 transition group">
    <div class="flex items-center gap-3 mb-2">
      <div class="w-9 h-9 rounded-xl bg-teal-50 text-teal-600 flex items-center justify-center text-sm font-semibold group-hover:scale-105 transition">
        <i class="fa fa-building"></i>
      </div>
      <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Rooms Occupied</span>
    </div>
    <div class="text-2xl font-extrabold text-slate-900 tracking-tight">
      {{ roombookings|selectattr("RBookStatus", "equalto", "Ongoing")|list|length + eventbookings|selectattr("EbookStatus", "equalto", "Ongoing")|list|length }}
    </div>
  </div>

  <!-- Total Feedbacks -->
  <div class="aria-card p-5 hover:border-slate-300 transition group">
    <div class="flex items-center gap-3 mb-2">
      <div class="w-9 h-9 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-sm font-semibold group-hover:scale-105 transition">
        <i class="fa fa-comments"></i>
      </div>
      <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Feedbacks</span>
    </div>
    <div class="text-2xl font-extrabold text-slate-900 tracking-tight">
      {{ feedbacks|length if feedbacks is defined else 0 }}
    </div>
  </div>
</div>
