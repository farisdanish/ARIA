<!-- Add Room Booking Modal (Tailwind / Alpine) -->
<div id="modaladdRBook"
     x-data="{ open: false }"
     @open-rbook-modal.window="open = true"
     @close-rbook-modal.window="open = false"
     @keydown.escape.window="open = false"
     x-show="open"
     class="fixed inset-0 z-50 overflow-y-auto"
     style="display: none;"
     role="dialog"
     aria-modal="true">

  <!-- Backdrop -->
  <div x-show="open"
       x-transition:enter="ease-out duration-200"
       x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100"
       x-transition:leave="ease-in duration-150"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       @click="open = false"
       class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs transition-opacity"></div>

  <!-- Modal Container -->
  <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
    <div x-show="open"
         x-transition:enter="ease-out duration-200"
         x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
         x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
         x-transition:leave="ease-in duration-150"
         x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
         x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
         @click.outside="open = false"
         class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-2xl border border-slate-100">

      <!-- Header -->
      <div class="flex items-center justify-between border-b border-slate-100 px-6 py-4">
        <div>
          <h3 class="text-lg font-bold text-slate-900">Room Booking</h3>
          <p class="text-xs text-slate-500">Reserve a campus study room or facility</p>
        </div>
        <button @click="open = false" type="button" class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-600 transition" aria-label="Close">
          <i class="fa fa-times text-base"></i>
        </button>
      </div>

      <!-- Body / Form -->
      <div class="px-6 py-5" id="modaladdRBookBody">
        <form hx-post="/AddRBook" hx-target="#modaladdRBookBody" hx-swap="innerHTML" hx-indicator="#rbook-indicator" enctype="multipart/form-data" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">{{ 'STUDENT' if user.is_Student() else 'STAFF' }} ID</label>
              <input type="text"
                     class="aria-input bg-slate-50 text-slate-500 font-semibold cursor-not-allowed"
                     id="{{ 'studid' if user.is_Student() else 'staffid' }}"
                     name="{{ 'studid' if user.is_Student() else 'staffid' }}"
                     value="{{ user.StudID if user.is_Student() else user.StaffID }}"
                     readonly>
            </div>

            <div>
              <label for="roomSelect" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Select Room</label>
              <select id="roomSelect" name="roomSelect" class="aria-input" required>
                <option disabled selected value>Choose a room...</option>
                {% for r in roomlist %}
                {% if r.RoomStatus != "Closed" and r.RoomType == "Normal Room" %}
                <option value="{{ r.RoomID }}">{{ r.RoomName }}</option>
                {% endif %}
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="p-3 rounded-xl bg-blue-50/70 border border-blue-100 text-blue-800 text-xs flex items-center gap-2">
            <i class="fa fa-info-circle text-blue-600 text-sm"></i>
            <span>Bookings are limited to <strong>2 hours maximum</strong> per session.</span>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label for="rbookstart" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Start Date & Time</label>
              <div class="grid grid-cols-2 gap-2">
                <input type="date" class="aria-input text-xs" id="rbookstart" name="rbookstart" required>
                <select class="aria-input text-xs" id="rbooktimeStart" name="rbooktimeStart" required>
                  <option disabled selected value>Time...</option>
                  <option value="09:00:00">09:00 AM</option>
                  <option value="10:00:00">10:00 AM</option>
                  <option value="11:00:00">11:00 AM</option>
                  <option value="12:00:00">12:00 PM</option>
                  <option value="13:00:00">01:00 PM</option>
                  <option value="14:00:00">02:00 PM</option>
                  <option value="15:00:00">03:00 PM</option>
                  <option value="16:00:00">04:00 PM</option>
                  <option value="17:00:00">05:00 PM</option>
                  <option value="18:00:00">06:00 PM</option>
                  <option value="19:00:00">07:00 PM</option>
                  <option value="20:00:00">08:00 PM</option>
                </select>
              </div>
            </div>

            <div>
              <label for="rbookend" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">End Date & Time</label>
              <div class="grid grid-cols-2 gap-2">
                <input type="date" class="aria-input text-xs" id="rbookend" name="rbookend" required>
                <select class="aria-input text-xs" id="rbooktimeEnd" name="rbooktimeEnd" required>
                  <option disabled selected value>Time...</option>
                  <option value="09:00:00">09:00 AM</option>
                  <option value="10:00:00">10:00 AM</option>
                  <option value="11:00:00">11:00 AM</option>
                  <option value="12:00:00">12:00 PM</option>
                  <option value="13:00:00">01:00 PM</option>
                  <option value="14:00:00">02:00 PM</option>
                  <option value="15:00:00">03:00 PM</option>
                  <option value="16:00:00">04:00 PM</option>
                  <option value="17:00:00">05:00 PM</option>
                  <option value="18:00:00">06:00 PM</option>
                  <option value="19:00:00">07:00 PM</option>
                  <option value="20:00:00">08:00 PM</option>
                  <option value="21:00:00">09:00 PM</option>
                </select>
              </div>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Check-in Method</label>
            <div class="flex gap-6">
              <label class="inline-flex items-center gap-2 cursor-pointer">
                <input type="radio" name="checkinMethod" id="rbook-qr" value="QR" checked class="text-blue-600 focus:ring-blue-500">
                <span class="text-sm font-medium text-slate-700">QR Code</span>
              </label>
              <label class="inline-flex items-center gap-2 cursor-pointer">
                <input type="radio" name="checkinMethod" id="rbook-face" value="Face" class="text-blue-600 focus:ring-blue-500">
                <span class="text-sm font-medium text-slate-700">Face Recognition</span>
              </label>
            </div>
          </div>

          <div>
            <label for="Purpose" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Booking Purpose</label>
            <textarea class="aria-input" id="Purpose" name="Purpose" rows="2" placeholder="e.g. Group study session, project discussion" required></textarea>
          </div>

          <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-100">
            <button @click="open = false" type="button" class="px-4 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">Cancel</button>
            <button type="submit" class="aria-btn-primary flex items-center gap-2">
              <span class="htmx-indicator w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin" id="rbook-indicator"></span>
              <span>Confirm Booking</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
