{% extends "auth_aria_base.html" %}
{% block title %}Staff Register - ARIA{% endblock %}

{% block auth_content %}
<div class="auth-card">
    <div class="mb-4">
        <a href="/RegisterSelect" class="text-decoration-none small fw-bold mb-3 d-inline-block text-primary">
            <i class="fa fa-arrow-left me-1"></i> Back to Selection
        </a>
        <h2 class="fw-bold text-dark">Staff Registration</h2>
        <p class="text-muted">Register as faculty or administration staff.</p>
    </div>

    <form method="POST" hx-boost="true" hx-indicator="#reg-spinner">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <div class="row g-2">
            <div class="col-md-12">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="StaffID" name="StaffID" placeholder="Staff ID" required 
                           hx-get="/api/auth/check-id?role=staff" hx-trigger="keyup changed delay:500ms" hx-target="#id-feedback" name="id">
                    <label for="StaffID">Staff ID Number</label>
                    <div id="id-feedback" class="position-absolute" style="top: 1.25rem; right: 1rem; z-index: 5;"></div>
                </div>
            </div>

            <div class="col-md-12">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="StaffName" name="StaffName" placeholder="Full Name" required>
                    <label for="StaffName">Full Name</label>
                </div>
            </div>

            <div class="col-md-6">
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="StaffEmail" name="StaffEmail" placeholder="Email" required>
                    <label for="StaffEmail">Official Email</label>
                </div>
            </div>

            <div class="col-md-6">
                <div class="form-floating mb-3">
                    <input type="tel" class="form-control" id="StaffContactNum" name="StaffContactNum" placeholder="Phone" required>
                    <label for="StaffContactNum">Contact Number</label>
                </div>
            </div>

            <div class="col-md-6">
                <div class="form-floating mb-3 position-relative">
                    <input type="password" class="form-control" id="StaffPassword1" name="StaffPassword1" placeholder="Password" required>
                    <label for="StaffPassword1">Password</label>
                    <span class="password-toggle" data-target="#StaffPassword1"><i class="fa fa-eye"></i></span>
                </div>
            </div>

            <div class="col-md-6">
                <div class="form-floating mb-3 position-relative">
                    <input type="password" class="form-control" id="StaffPassword2" name="StaffPassword2" placeholder="Confirm" required>
                    <label for="StaffPassword2">Confirm Password</label>
                    <span class="password-toggle" data-target="#StaffPassword2"><i class="fa fa-eye"></i></span>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 py-3 mt-3 rounded-pill fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">
            <span>Register as Staff</span>
            <div id="reg-spinner" class="htmx-indicator spinner-border spinner-border-sm" role="status"></div>
        </button>
    </form>

    <div class="text-center mt-4">
        <p class="text-muted small">Already have an account? <a href="/login" class="text-primary fw-bold text-decoration-none">Sign In</a></p>
    </div>
</div>
{% endblock %}
