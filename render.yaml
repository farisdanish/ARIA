services:
  - type: web
    name: aria
    runtime: python
    rootDir: aria-app
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DB
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: aria-db
          property: connectionString

databases:
  - name: aria-db
    databaseName: ariadb
    plan: free
