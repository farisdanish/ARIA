name: ARIA CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # 1. LINT & STATIC ANALYSIS
  # ─────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linters
        run: pip install ruff bandit
      - name: Run Ruff (style + errors)
        run: ruff check aria-app/
      - name: Run Bandit (security)
        run: bandit -r aria-app/website/ aria-app/client/ -ll

  # ─────────────────────────────────────────
  # 2. UNIT TESTS
  # ─────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7.0-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: aria-app
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-flask
      - name: Build Tailwind CSS
        run: |
          curl -sLo tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64
          chmod +x tailwindcss
          ./tailwindcss -c ./tailwind.config.js -i ./aria-app/website/static/css/src/tailwind-input.css -o ./aria-app/website/static/css/tailwind.css --minify

      - name: Run tests
        working-directory: aria-app
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
          SECRET_KEY: ci-test-secret
          TESTING: "true"
          FLASK_SKIP_BACKGROUND_THREADS: "1"
        run: pytest tests/ -m "not e2e" -v

  # ─────────────────────────────────────────
  # 3. E2E SMOKE TESTS (Playwright)
  # ─────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: aria-app
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-flask pytest-playwright
          playwright install --with-deps chromium
      - name: Build Tailwind CSS
        run: |
          curl -sLo tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64
          chmod +x tailwindcss
          ./tailwindcss -c ./tailwind.config.js -i ./aria-app/website/static/css/src/tailwind-input.css -o ./aria-app/website/static/css/tailwind.css --minify
      - name: Run Playwright smoke tests
        working-directory: aria-app
        env:
          TESTING: "true"
          FLASK_SKIP_BACKGROUND_THREADS: "1"
        run: pytest tests/e2e/ -v

  # ─────────────────────────────────────────
  # 4. DOCKER BUILD VALIDATION
  # ─────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build flask-app image
        uses: docker/build-push-action@v5
        with:
          context: ./aria-app
          file: ./aria-app/Dockerfile
          push: false
          tags: aria-flask-app:ci
      - name: Build pi-simulator image
        uses: docker/build-push-action@v5
        with:
          context: ./aria-app/client
          file: ./aria-app/client/Dockerfile.simulator
          push: false
          tags: aria-pi-simulator:ci
