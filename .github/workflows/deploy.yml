name: Deploy to Cloud

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            cd /home/aria/ARIA
            git pull origin master
            source aria-app/venv/bin/activate
            pip install -r aria-app/requirements.txt --quiet
            
            # Load production environment variables for CLI commands
            set -a
            if [ -r /etc/aria/.env ]; then
              . /etc/aria/.env
            elif sudo test -r /etc/aria/.env; then
              eval "$(sudo grep -v '^#' /etc/aria/.env | sed -E 's/^([^=]+)=(.*)$/export \1="\2"/')"
            fi
            set +a
            
            # Auto-stamp baseline migration if unversioned tables exist
            cd /home/aria/ARIA/aria-app
            FLASK_SKIP_BACKGROUND_THREADS=1 AUTO_CREATE_DB=false python3 -c "
            from website.app import create_app
            from website.models.base import db
            from sqlalchemy import inspect
            from flask_migrate import stamp
            app = create_app()
            with app.app_context():
                inspector = inspect(db.engine)
                tables = inspector.get_table_names()
                if 'student' in tables and 'alembic_version' not in tables:
                    print('Existing unversioned database detected. Auto-stamping to head...')
                    stamp(directory='migrations', revision='head')
            "
            FLASK_SKIP_BACKGROUND_THREADS=1 AUTO_CREATE_DB=false flask db upgrade
            
            # Sync systemd unit and restart service
            sudo cp /home/aria/ARIA/aria-app/aria.service /etc/systemd/system/aria.service
            sudo systemctl daemon-reload
            sudo systemctl restart aria
